<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Helaberry Studio · UI/UX Design Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link rel="stylesheet" href="{{ url_for('static', filename='styles/helaui.css') }}" />
</head>
<body>

<div class="app">
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="logo" id="brandBtn" title="Helaberry Studio">
      <div class="logo-icon">H</div>
      <div class="logo-name">Helaberry</div>
    </div>
    <div class="divider"></div>
    <div class="file-name" id="fileName" title="Double-click to rename">
      <i class="fas fa-file-alt" style="font-size:11px;opacity:0.5;"></i>
      <span id="fileNameText">Untitled Design</span>
    </div>
    <div class="spacer"></div>
    <button class="tb-btn icon-only" id="undoBtn" title="Undo (Ctrl+Z)" disabled><i class="fas fa-rotate-left"></i></button>
    <button class="tb-btn icon-only" id="redoBtn" title="Redo (Ctrl+Shift+Z)" disabled><i class="fas fa-rotate-right"></i></button>
    <div class="divider"></div>
    <button class="tb-btn icon-only" id="mobileLeftBtn" title="Layers" style="display:none;"><i class="fas fa-layer-group"></i></button>
    <button class="tb-btn icon-only" id="mobileRightBtn" title="Properties" style="display:none;"><i class="fas fa-sliders"></i></button>

    <!-- HOME BUTTON -->
    <a class="tb-btn home" id="homeBtn" href="{{ url_for('homepage') }}" title="Back to Home"><i class="fas fa-house"></i> <span class="hide-mobile">Home</span></a>

    <button class="tb-btn preview" id="previewBtn" title="Preview (Shift+P)"><i class="fas fa-play"></i> <span class="hide-mobile">Preview</span></button>
    <button class="tb-btn" id="exportBtn" title="Export"><i class="fas fa-download"></i> <span class="hide-mobile">Export</span></button>
    <button class="tb-btn primary" id="shareBtn"><i class="fas fa-share-nodes"></i> <span class="hide-mobile">Share</span></button>
    <div class="avatar" title="Account">HB</div>
  </header>

  <!-- WORKSPACE -->
  <div class="workspace">
    <!-- LEFT PANEL -->
    <aside class="panel panel-left" id="leftPanel">
      <div class="panel-tabs">
        <button class="panel-tab active" data-tab="layers">Layers</button>
        <button class="panel-tab" data-tab="assets">Assets</button>
      </div>
      <div class="panel-body" id="tabLayers">
        <div class="section">
          <div class="section-head" data-collapse><span>Pages</span><i class="fas fa-chevron-down chev"></i></div>
          <div class="section-body">
            <div class="pages-list" id="pagesList"></div>
            <button class="add-page" id="addPageBtn"><i class="fas fa-plus" style="font-size:10px;"></i> New page</button>
          </div>
        </div>
        <div class="section">
          <div class="section-head" data-collapse><span>Layers</span><i class="fas fa-chevron-down chev"></i></div>
          <div class="section-body"><div class="layers-list" id="layersList"></div></div>
        </div>
      </div>
      <div class="panel-body" id="tabAssets" style="display:none;">
        <div class="section">
          <div class="section-head" data-collapse><span>Components</span><i class="fas fa-chevron-down chev"></i></div>
          <div class="section-body"><div class="assets-grid" id="componentsGrid"></div></div>
        </div>
        <div class="section">
          <div class="section-head" data-collapse><span>Color styles</span><i class="fas fa-chevron-down chev"></i></div>
          <div class="section-body"><div id="colorStylesList"></div></div>
        </div>
        <div class="section">
          <div class="section-head" data-collapse><span>Text styles</span><i class="fas fa-chevron-down chev"></i></div>
          <div class="section-body"><div id="textStylesList"></div></div>
        </div>
      </div>
    </aside>

    <!-- CANVAS -->
    <div class="canvas-wrap">
      <div class="canvas-viewport" id="viewport">
        <div class="canvas-world" id="world">
          <div class="canvas-grid"></div>
          <div class="selection-overlay" id="selectionOverlay"></div>
        </div>
      </div>

      <div class="toolbar" id="toolbar">
        <button class="tool-btn active" data-tool="select" title="Select (V)"><i class="fas fa-mouse-pointer"></i><span class="tool-key">V</span></button>
        <button class="tool-btn" data-tool="frame" title="Frame (F)"><i class="fas fa-vector-square"></i><span class="tool-key">F</span></button>
        <button class="tool-btn" data-tool="rect" title="Rectangle (R)"><i class="far fa-square"></i><span class="tool-key">R</span></button>
        <button class="tool-btn" data-tool="ellipse" title="Ellipse (O)"><i class="far fa-circle"></i><span class="tool-key">O</span></button>
        <button class="tool-btn" data-tool="line" title="Line (L)"><i class="fas fa-minus"></i><span class="tool-key">L</span></button>
        <button class="tool-btn" data-tool="text" title="Text (T)"><i class="fas fa-font"></i><span class="tool-key">T</span></button>
        <button class="tool-btn" data-tool="pen" title="Pen / Freehand (P)"><i class="fas fa-pen"></i><span class="tool-key">P</span></button>
        <button class="tool-btn" data-tool="image" title="Image (I)"><i class="far fa-image"></i><span class="tool-key">I</span></button>
        <div class="tool-sep"></div>
        <button class="tool-btn" data-tool="hand" title="Hand (H / Space)"><i class="far fa-hand"></i><span class="tool-key">H</span></button>
      </div>

      <div class="zoom-bar">
        <button class="zoom-btn" id="zoomOutBtn" title="Zoom out"><i class="fas fa-minus"></i></button>
        <div class="zoom-val" id="zoomVal" title="Reset zoom (Ctrl+0)">100%</div>
        <button class="zoom-btn" id="zoomInBtn" title="Zoom in"><i class="fas fa-plus"></i></button>
        <div class="zoom-sep"></div>
        <button class="zoom-btn" id="fitBtn" title="Fit to screen (Shift+1)"><i class="fas fa-expand"></i></button>
      </div>

      <div class="shortcut-hint">
        <div class="hint-chip"><kbd>V</kbd> select <kbd>R</kbd> rect <kbd>T</kbd> text <kbd>Space</kbd> pan</div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <aside class="panel panel-right" id="rightPanel">
      <div class="panel-tabs">
        <button class="panel-tab active" data-tab="design">Design</button>
        <button class="panel-tab" data-tab="prototype">Prototype</button>
        <button class="panel-tab" data-tab="inspect">Inspect</button>
      </div>
      <div class="panel-body" id="tabDesign"><div id="designContent"></div></div>
      <div class="panel-body" id="tabPrototype" style="display:none;"><div id="prototypeContent"></div></div>
      <div class="panel-body" id="tabInspect" style="display:none;"><div id="inspectContent"></div></div>
    </aside>
  </div>
</div>

<div id="toastContainer"></div>
<input type="color" id="hiddenColor" style="position:fixed;left:-9999px;top:-9999px;">

<script src="{{ url_for('static', filename='js/helaui.js') }}"></script>
</body>
</html>
